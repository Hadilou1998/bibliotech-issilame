[project]
name = "bibliotech"
version = "1.3.0"
description = "Gestion d'une bibliothèque municipale (projet fil rouge Clean Code)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8
